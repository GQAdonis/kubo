[decisions]
pins-go = "Kubo Go dependency pins live in go.mod and change only via go get + make mod_tidy; this file records MCP-related pins and decisions only"
fork-only = "2026-10-09: GQAdonis/kubo is fork-only for now; upstream conversation happens after a working result"
mcp-placement = "2026-10-09: F4 - `ipfs mcp` CLI command in the root module, RPC-only to a running daemon (stock or fork), stdio default plus opt-in Streamable HTTP; decided by the adversarially reviewed ipfs-mcp-server assessment"
mcp-root-deps = "2026-10-09: modelcontextprotocol/go-sdk and its modules in the root go.mod are accepted"
mcp-stock-kubo = "2026-10-09: no separate binary; the fork's ipfs binary serves MCP against any compatible daemon, with minimum-version detection and per-tool degradation"
mcp-http-auth = "2026-10-09: static bearer token for Streamable HTTP now, behind a replaceable verifier designed for Ory Kratos (identity) + Ory Hydra (OAuth2) later"
mcp-http-scope = "2026-10-09: Streamable HTTP exposes the full tool set, including writes and destructive tools"
mcp-confirmation = "2026-10-09: every write and destructive tool requires confirmation on every transport (elicitation where supported, defined fallback otherwise; never silent)"
distribution = "2026-10-09: release binaries; plugin marketplaces for Claude Code, Codex and OpenCode (Kimi plugin packaging out of scope this phase)"
webmcp-hosts = "2026-10-09: Codex desktop and Kimi desktop are the first WebMCP targets, gated on a host-support spike"
agents-md-commit = "2026-10-09: AGENTS.md is committed together with the implementation (fork-only waiver of the upstream separate-PR rule)"

