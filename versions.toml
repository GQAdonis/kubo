# Authoritative architecture decisions and dependency pins.
# Agents must not contradict this file. Agents may update it when the operator
# directs a pin or decision change; record each change with its date.
# Go dependency pins for kubo itself live in the three go.mod files (root,
# docs/examples/kubo-as-a-library, test/dependencies) and change only via
# `go get` + `make mod_tidy`; this file never overrides go.mod.

[meta]
created = "2026-10-09"
updated = "2026-10-14"

[pins]
