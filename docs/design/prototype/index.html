/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ---------- Fonts (bundled, Latin subset — Promethity v1) ---------- */
@font-face { font-family: "Syne"; font-weight: 600; font-display: swap; src: url(assets/fonts/syne-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Syne"; font-weight: 700; font-display: swap; src: url(assets/fonts/syne-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 400; font-display: swap; src: url(assets/fonts/hanken-grotesk-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 500; font-display: swap; src: url(assets/fonts/hanken-grotesk-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 600; font-display: swap; src: url(assets/fonts/hanken-grotesk-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: swap; src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }

/* ---------- Tokens (from promethity/branding/design-system/tokens.css) ---------- */
:root, [data-theme="dark"] {
  --ground: #0C0B0A; --surface: #171614; --raised: #222120; --control: #2D2C2A;
  --text: #F5F2EE; --text-muted: #A09890;
  --accent: #E96A12; --on-accent: #0C0B0A; --accent-text: #E96A12; --accent-tint: #342214;
  --ok: #5FBF7A; --ok-tint: #212E22; --warn: #F2B33D; --warn-tint: #362C1A;
  --err: #F0705A; --err-tint: #35231E; --info: #7FB2D9; --info-tint: #262C30;
  --hover: #2A2927; --scrim: rgba(12,11,10,.72);
  --edge: inset 0 0 0 1px #3A3936; /* D7: the one edge, form controls only */
  color-scheme: dark;
}
[data-theme="light"] {
  --ground: #F5F2EE; --surface: #FBF9F6; --raised: #ECE7E0; --control: #E1DBD2;
  --text: #141210; --text-muted: #5E5750;
  --accent: #CE3012; --on-accent: #FFFFFF; --accent-text: #B02A10; --accent-tint: #F6E5DF;
  --ok: #1A6B35; --ok-tint: #E4EBE3; --warn: #8A5A00; --warn-tint: #F0E9DD;
  --err: #B3261E; --err-tint: #F4E4E0; --info: #1F5E8C; --info-tint: #E5EAEB;
  --hover: #E6E0D8; --scrim: rgba(20,18,16,.4);
  --edge: inset 0 0 0 1px #CFC7BC;
  color-scheme: light;
}
:root {
  --font-head: "Syne", system-ui, sans-serif;
  --font-ui: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --s1: 4px; --s2: 8px; --s3: 14px; --s4: 24px; --s5: 40px; --s6: 56px; --s7: 88px;
  --r-ctl: 6px; --r-card: 10px; --r-panel: 16px; --r-pill: 999px;
  --t-fast: 180ms; --t-exit: 120ms; --ease-out: cubic-bezier(.2,.7,.2,1); --ease-in: cubic-bezier(.5,0,.8,.4);
  --rail-w: 148px; --top-h: 64px; --pane-w: 400px;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--text); font: 400 16px/1.6 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 2vw + 16px, 44px); line-height: 1.08; }
h2 { font-size: 28px; line-height: 1.15; }
h3 { font-size: 22px; line-height: 1.2; }
h4 { font-size: 17px; line-height: 1.3; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-ctl); }
.mono { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0; }
.muted { color: var(--text-muted); }
.small { font-size: 14px; line-height: 1.55; }
.eyebrow { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0,1fr) auto; height: 100vh; height: 100dvh; }
.rail { background: var(--surface); display: flex; flex-direction: column; padding: var(--s4) var(--s2) var(--s3); gap: var(--s4); }
.rail .brand { display: block; padding: 0 var(--s2); }
.rail .brand img { width: 120px; height: auto; display: block; }
.rail .brand .mark { display: none; width: 36px; }
[data-theme="dark"] .logo-light, [data-theme="light"] .logo-dark { display: none !important; }
.nav { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.nav a { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: var(--r-ctl); color: var(--text-muted); font-weight: 500; font-size: 15px; text-decoration: none; position: relative; transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out); }
.nav a .od-icon { --od-icon-size: 20px; }
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
.nav .count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--r-pill); background: var(--warn-tint); color: var(--warn); font: 600 12px/22px var(--font-ui); text-align: center; }
.nav-sep { height: var(--s3); }
.rail .foot { margin-top: auto; display: grid; gap: 2px; }
.rail .foot .nav a { font-size: 14px; }

.main { display: grid; grid-template-rows: var(--top-h) minmax(0,1fr); min-width: 0; }
.top { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); }
.cmd { flex: 1 1 auto; max-width: 640px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 14px; border: 0; border-radius: var(--r-ctl); background: var(--surface); color: var(--text-muted); cursor: pointer; text-align: left; transition: background var(--t-fast) var(--ease-out); }
.cmd:hover { background: var(--raised); }
.cmd .od-icon { --od-icon-size: 18px; }
.cmd .hint { flex: 1; min-width: 0; }
kbd { font: 500 12px/1 var(--font-mono); padding: 4px 6px; border-radius: 4px; background: var(--control); color: var(--text-muted); }
.top .status { display: flex; align-items: center; gap: var(--s3); margin-left: auto; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--text-muted); cursor: pointer; position: relative; transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out); }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.iconbtn .od-icon { --od-icon-size: 20px; }
.iconbtn[aria-pressed="true"] { color: var(--accent-text); }
.content { overflow-y: auto; min-height: 0; padding: var(--s3) var(--s5) var(--s6); scroll-behavior: smooth; }
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: var(--s5); }
.page-head { display: grid; gap: var(--s2); }
.page-head p { color: var(--text-muted); max-width: 66ch; }

/* ---------- Badges, buttons, controls ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font: 600 12.5px/1 var(--font-ui); white-space: nowrap; background: var(--raised); color: var(--text-muted); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-tint); color: var(--ok); }
.badge.warn { background: var(--warn-tint); color: var(--warn); }
.badge.err { background: var(--err-tint); color: var(--err); }
.badge.info { background: var(--info-tint); color: var(--info); }
.badge.accent { background: var(--accent-tint); color: var(--accent-text); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--r-ctl); background: var(--control); color: var(--text); font: 600 14.5px/1 var(--font-ui); cursor: pointer; white-space: nowrap; transition: background var(--t-fast) var(--ease-out), filter var(--t-fast) var(--ease-out), opacity var(--t-fast); text-decoration: none; }
.btn:hover { background: var(--hover); text-decoration: none; }
[data-theme="dark"] .btn:hover { background: #383734; }
.btn .od-icon { --od-icon-size: 18px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { background: transparent; color: var(--text-muted); padding: 0 12px; }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger-text { color: var(--err); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label, .field .label { font: 600 14.5px/1.2 var(--font-ui); }
.field .help { font-size: 14px; line-height: 1.5; color: var(--text-muted); max-width: 60ch; }
.input { width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: var(--r-ctl); background: var(--control); box-shadow: var(--edge); color: var(--text); }
.input::placeholder { color: var(--text-muted); }
.input.mono { font-size: 14px; }
.switch { position: relative; flex: none; width: 44px; height: 26px; border: 0; border-radius: var(--r-pill); background: var(--control); box-shadow: var(--edge); cursor: pointer; transition: background var(--t-fast) var(--ease-out); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-muted); transition: transform var(--t-fast) var(--ease-out), background var(--t-fast); }
.switch[aria-checked="true"] { background: var(--ok-tint); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--ok); }
.switch[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: var(--r-ctl); background: var(--control); }
.seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 4px; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border-radius: var(--r-card); padding: var(--s4); display: grid; gap: var(--s3); align-content: start; }
.card.raised { background: var(--raised); }
.card-head { display: flex; align-items: center; gap: var(--s2); }
.card-head h4 { flex: 1; min-width: 0; }
.panel { background: var(--surface); border-radius: var(--r-panel); padding: var(--s4); }
.stat-num { font: 600 clamp(26px, 1.4vw + 16px, 34px)/1.05 var(--font-head); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat-cap { font-size: 14px; color: var(--text-muted); }
.list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.row { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 10px var(--s3); border-radius: var(--r-ctl); background: var(--surface); }
.row:nth-child(even) { background: var(--raised); }
.row.link { cursor: pointer; transition: background var(--t-fast) var(--ease-out); }
.row.link:hover { background: var(--hover); }
.table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 15px; }
.table th { text-align: left; font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); padding: 10px var(--s3); }
.table td { padding: 12px var(--s3); background: var(--surface); vertical-align: middle; }
.table tr:nth-child(even) td { background: var(--raised); }
.table td:first-child { border-radius: var(--r-ctl) 0 0 var(--r-ctl); }
.table td:last-child { border-radius: 0 var(--r-ctl) var(--r-ctl) 0; }
.table tbody tr { transition: filter var(--t-fast); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.cid { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font: 400 13px/1.4 var(--font-mono); color: var(--text-muted); }
.cid span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cid button { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--text-muted); cursor: pointer; }
.cid button:hover { background: var(--hover); color: var(--text); }
.cid button .od-icon { --od-icon-size: 14px; }
.callout { display: grid; gap: 6px; padding: var(--s3) var(--s4); border-radius: var(--r-card); background: var(--accent-tint); }
.callout.info { background: var(--info-tint); }
.callout.warn { background: var(--warn-tint); }
.callout.err { background: var(--err-tint); }
.untrusted { display: grid; gap: 8px; padding: var(--s3); border-radius: var(--r-ctl); background: var(--raised); }
.untrusted .eyebrow { color: var(--info); }

/* ---------- Approval card (one state machine, every surface) ---------- */
.approval { display: grid; gap: var(--s3); padding: var(--s4); border-radius: var(--r-card); background: var(--surface); }
.approval.in-chat { background: var(--raised); padding: var(--s3) var(--s3) var(--s3); }
.approval .ap-head { display: flex; align-items: flex-start; gap: var(--s3); }
.approval .ap-title { flex: 1; min-width: 0; display: grid; gap: 4px; }
.approval .ap-title h4 { font-size: 17px; }
.approval dl { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 6px var(--s3); margin: 0; font-size: 14px; }
.approval dt { color: var(--text-muted); }
.approval dd { margin: 0; min-width: 0; }
.approval .ap-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.approval .ap-actions .note { font-size: 13px; color: var(--text-muted); margin-left: auto; }
.approval .arming { position: relative; overflow: hidden; }
.approval .arming::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--on-accent); opacity: .5; transform-origin: left; animation: arm 1s linear forwards; }
@keyframes arm { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.approval .outcome { font-size: 14px; color: var(--text-muted); }

/* ---------- Agent pane ---------- */
.pane { width: var(--pane-w); background: var(--surface); display: none; grid-template-rows: auto auto minmax(0,1fr) auto; min-height: 0; }
.app.pane-open .pane { display: grid; }
.pane-head { display: flex; align-items: center; gap: var(--s2); height: var(--top-h); padding: 0 var(--s2) 0 var(--s4); }
.pane-head h3 { font-size: 17px; flex: 1; }
.pane-sub { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s4) var(--s3); font-size: 13px; color: var(--text-muted); }
.stream { overflow-y: auto; min-height: 0; padding: 0 var(--s4) var(--s4); display: grid; gap: var(--s3); align-content: start; }
.msg { display: grid; gap: 6px; }
.msg .who { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.msg.user .bubble { justify-self: end; max-width: 88%; background: var(--control); padding: 10px 14px; border-radius: var(--r-card) var(--r-card) 4px var(--r-card); }
.msg.user .who { justify-self: end; }
.msg .bubble { font-size: 15px; line-height: 1.6; }
.msg.agent .bubble p + p { margin-top: 8px; }
.tool { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--raised); font-size: 14px; }
.tool .t-head { display: flex; align-items: center; gap: 8px; }
.tool .t-head .od-icon { --od-icon-size: 16px; color: var(--text-muted); }
.tool .t-name { font: 500 13px/1.3 var(--font-mono); flex: 1; min-width: 0; }
.tool details summary { cursor: pointer; color: var(--text-muted); font-size: 13px; list-style: none; }
.tool details summary::-webkit-details-marker { display: none; }
.tool pre { margin: 6px 0 0; padding: 10px; border-radius: 4px; background: var(--ground); font: 400 12px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-muted); }
.composer { padding: var(--s3) var(--s4) var(--s4); display: grid; gap: var(--s2); }
.composer .ctx { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 10px; border-radius: var(--r-pill); background: var(--raised); font-size: 13px; color: var(--text); max-width: 100%; }
.chip .od-icon { --od-icon-size: 14px; color: var(--text-muted); }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 50%; background: transparent; color: var(--text-muted); cursor: pointer; }
.chip button:hover { background: var(--hover); color: var(--text); }
.composer form { display: flex; align-items: flex-end; gap: var(--s2); padding: 6px 6px 6px 12px; border-radius: var(--r-card); background: var(--control); box-shadow: var(--edge); }
.composer textarea { flex: 1; min-height: 44px; max-height: 160px; resize: none; border: 0; background: transparent; padding: 10px 0; line-height: 1.5; }
.composer textarea:focus { outline: none; }
.composer form:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-ctl); font-size: 14px; }
.notice.warn { background: var(--warn-tint); }
.notice.err { background: var(--err-tint); }
.notice.info { background: var(--info-tint); }
.notice .od-icon { --od-icon-size: 16px; }
.notice.warn .od-icon { color: var(--warn); }
.notice.err .od-icon { color: var(--err); }
.notice.info .od-icon { color: var(--info); }

/* ---------- Command palette ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: none; align-items: flex-start; justify-content: center; padding: 10vh var(--s3) var(--s3); }
.overlay.open { display: flex; animation: fade var(--t-fast) var(--ease-out); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.palette { width: min(680px, 100%); background: var(--surface); border-radius: var(--r-panel); display: grid; overflow: hidden; animation: rise var(--t-fast) var(--ease-out); }
.palette .pin { display: flex; align-items: center; gap: 10px; padding: 0 var(--s4); height: 64px; }
.palette .pin .od-icon { --od-icon-size: 20px; color: var(--text-muted); }
.palette .pin input { flex: 1; border: 0; background: transparent; font-size: 18px; min-width: 0; }
.palette .pin input:focus { outline: none; }
.palette .modes { display: flex; gap: 4px; padding: 0 var(--s4) var(--s3); }
.palette .modes button { min-height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--text-muted); font-weight: 600; font-size: 14px; cursor: pointer; }
.palette .modes button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.palette .results { display: grid; gap: 2px; padding: var(--s2); max-height: 50vh; overflow-y: auto; background: var(--ground); }
.palette .res { display: flex; align-items: center; gap: var(--s3); min-height: 52px; padding: 8px var(--s3); border: 0; border-radius: var(--r-ctl); background: transparent; text-align: left; cursor: pointer; color: var(--text); width: 100%; }
.palette .res:hover, .palette .res[aria-selected="true"] { background: var(--raised); }
.palette .res .od-icon { --od-icon-size: 18px; color: var(--text-muted); }
.palette .res .od-field { flex: 1; min-width: 0; }
.palette .foot { display: flex; gap: var(--s3); padding: 10px var(--s4); font-size: 13px; color: var(--text-muted); }

/* ---------- Modal (WebMCP approval: modal alertdialog by spec R13) ---------- */
.modal { width: min(560px, 100%); background: var(--surface); border-radius: var(--r-panel); padding: var(--s4); display: grid; gap: var(--s3); animation: rise var(--t-fast) var(--ease-out); align-self: center; }
.modal .approval { padding: 0; background: transparent; }

/* ---------- Toast ---------- */
.toast { position: fixed; z-index: 60; left: 50%; bottom: var(--s4); transform: translateX(-50%); display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--r-card); background: var(--raised); font-size: 14px; max-width: calc(100vw - 32px); }
.toast.show { display: flex; animation: rise var(--t-fast) var(--ease-out); }

/* ---------- Stepper (setup) ---------- */
.steps { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; align-items: center; gap: var(--s3); min-height: 52px; padding: 0 var(--s3); border-radius: var(--r-ctl); color: var(--text-muted); font-size: 15px; }
.steps li .n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--control); font: 600 13px/1 var(--font-ui); flex: none; }
.steps li[aria-current="step"] { background: var(--surface); color: var(--text); font-weight: 600; }
.steps li[aria-current="step"] .n { background: var(--accent-tint); color: var(--accent-text); }
.steps li.done .n { background: var(--ok-tint); color: var(--ok); }
.steps li.done { color: var(--text); }

/* ---------- Settings sub-nav ---------- */
.split { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: var(--s5); align-items: start; }
.subnav { position: sticky; top: 0; display: grid; gap: 2px; }
.subnav a { display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: var(--r-ctl); color: var(--text-muted); font-weight: 500; text-decoration: none; }
.subnav a:hover { background: var(--hover); color: var(--text); }
.subnav a[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
.setting { display: flex; align-items: flex-start; gap: var(--s4); padding: var(--s3) 0; }
.setting + .setting { padding-top: var(--s3); }
.applybar { position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-card); background: var(--raised); }

/* ---------- Spec board ---------- */
.board { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-items: start; }
.frame-label { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: var(--s2); display: block; }
.macwin { border-radius: 12px; background: var(--surface); overflow: hidden; outline: 1px solid rgba(255,255,255,.06); }
[data-theme="light"] .macwin { outline-color: rgba(0,0,0,.08); }
.macwin .bar { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; background: var(--raised); font-size: 13px; color: var(--text-muted); }
.macwin .bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--control); display: block; }
.macwin .bar b { flex: 1; text-align: center; font-weight: 500; margin-right: 52px; }
.macwin .body { padding: var(--s4); display: grid; gap: var(--s3); }
.traymenu { width: 300px; max-width: 100%; border-radius: 10px; padding: 6px; background: var(--raised); font-size: 14px; display: grid; gap: 1px; }
.traymenu .ti { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 0 10px; border-radius: 5px; }
.traymenu .ti:hover { background: var(--accent); color: var(--on-accent); }
.traymenu .ti:hover .muted, .traymenu .ti:hover .kbdx { color: var(--on-accent); }
.traymenu .ti .od-icon { --od-icon-size: 15px; }
.traymenu .sep { height: 1px; margin: 4px 10px; background: var(--control); }
.traymenu .kbdx { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.traymenu .head { padding: 8px 10px; display: grid; gap: 2px; }
.menubar { display: flex; align-items: center; justify-content: flex-end; gap: 14px; height: 28px; padding: 0 12px; border-radius: 6px 6px 0 0; background: var(--control); font-size: 13px; margin-bottom: 6px; }
.menubar .flame { color: var(--accent); }
.pair-code { display: flex; gap: 6px; flex-wrap: wrap; }
.pair-code b { display: inline-grid; place-items: center; width: 44px; height: 52px; border-radius: var(--r-ctl); background: var(--raised); font: 600 24px/1 var(--font-mono); }
.spark { width: 100%; height: 56px; display: block; }
.meter { height: 8px; border-radius: var(--r-pill); background: var(--raised); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--text-muted); border-radius: var(--r-pill); }
.state-grid { display: grid; gap: var(--s3); }

/* ---------- Praxis: canvas/assistant states (WS-03) ---------- */
.app[data-canvas-state="docked"]   { --pane-w: 480px; }
.app[data-canvas-state="expanded"] { --pane-w: 760px; }
.app[data-canvas-state="full"] .main { display: none; }
.app[data-canvas-state="full"] { grid-template-columns: var(--rail-w) minmax(0,1fr); }
.app[data-canvas-state="full"] .pane { width: auto; }
.pane-modes { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--r-ctl); background: var(--raised); }
.pane-modes button { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 4px; background: transparent; color: var(--text-muted); cursor: pointer; }
.pane-modes button:hover { color: var(--text); background: var(--hover); }
.pane-modes button[aria-pressed="true"] { background: var(--surface); color: var(--text); }
.pane-modes .od-icon { --od-icon-size: 16px; }

/* Visible context strip (WS-06) */
.ctxstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 var(--s4) var(--s3); }
.ctxstrip .chip.ai { background: var(--info-tint); }
.ctxstrip .chip.ai .od-icon { color: var(--info); }
.linkbtn { border: 0; background: transparent; color: var(--accent-text); font: 600 13px/1 var(--font-ui); cursor: pointer; padding: 8px 4px; min-height: 30px; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Lifecycle strip (named phases, no spinner) */
.lifecycle { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12.5px; color: var(--text-muted); }
.lifecycle .ph { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: var(--raised); white-space: nowrap; }
.lifecycle .ph.done { color: var(--text); }
.lifecycle .ph.now { background: var(--info-tint); color: var(--info); }
.lifecycle .ph.wait { background: var(--warn-tint); color: var(--warn); }
.lifecycle .ph .od-icon { --od-icon-size: 12px; }
.lifecycle .arrow { opacity: .6; }
.streaming::after { content: ""; display: inline-block; width: 8px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--info); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Context inspector */
.inspector { position: absolute; inset: 0; z-index: 5; background: var(--surface); display: grid; grid-template-rows: auto auto minmax(0,1fr); animation: rise var(--t-fast) var(--ease-out); }
.pane { position: relative; }
.tabs { display: flex; gap: 2px; padding: 0 var(--s4) var(--s3); overflow-x: auto; }
.tabs button { min-height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--text-muted); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--raised); color: var(--text); }
.kv { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 8px var(--s3); font-size: 14px; margin: 0; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Home composer (HOME-01) */
.composer-home { display: grid; gap: var(--s3); padding: var(--s4); border-radius: var(--r-panel); background: var(--surface); }
.composer-home form { display: flex; align-items: flex-end; gap: var(--s2); padding: 6px 6px 6px 14px; border-radius: var(--r-card); background: var(--control); box-shadow: var(--edge); }
.composer-home form:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.composer-home textarea { flex: 1; min-height: 48px; resize: none; border: 0; background: transparent; padding: 12px 0; font-size: 17px; line-height: 1.5; }
.composer-home textarea:focus { outline: none; }
.suggest { display: flex; flex-wrap: wrap; gap: var(--s2); }
.suggest button { min-height: 36px; padding: 0 14px; border: 0; border-radius: var(--r-pill); background: var(--raised); color: var(--text); font-size: 14px; cursor: pointer; }
.suggest button:hover { background: var(--hover); }

/* Thread mode (conversation-forward: navigator · thread · canvas) */
.thread-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--s4); min-height: 100%; align-items: start; }
.thread-col { display: grid; gap: var(--s3); max-width: 720px; }
.canvas-col { position: sticky; top: 0; display: grid; gap: var(--s3); }
.surface-strip { display: flex; align-items: center; gap: var(--s2); height: 40px; padding: 0 var(--s3); border-radius: var(--r-card) var(--r-card) 0 0; background: var(--raised); font-size: 13px; color: var(--text-muted); }
.surface-body { background: var(--surface); border-radius: 0 0 var(--r-card) var(--r-card); padding: var(--s4); display: grid; gap: var(--s3); }
.inert { display: grid; gap: 4px; padding: var(--s3); border-radius: var(--r-ctl); background: var(--raised); font-size: 14px; }

/* Decision state badge row + receipt */
.digest { font: 400 12.5px/1.4 var(--font-mono); color: var(--text-muted); }
.receipt { display: grid; gap: 4px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--ok-tint); font-size: 14px; }
.origin-guard { display: grid; gap: var(--s2); padding: var(--s4); border-radius: var(--r-card); background: var(--warn-tint); }
.card-state { min-height: 120px; }
.skeleton { height: 12px; border-radius: var(--r-pill); background: var(--raised); }
.skeleton + .skeleton { margin-top: 10px; }

/* ---------- Views v2: shared pieces ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.toolbar .od-fill { min-width: 8px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchips button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 0; border-radius: var(--r-pill); background: var(--surface); color: var(--text-muted); font: 600 14px/1 var(--font-ui); cursor: pointer; }
.fchips button:hover { background: var(--hover); color: var(--text); }
.fchips button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.fchips .n { font-variant-numeric: tabular-nums; color: var(--text-muted); font-weight: 500; }
.with-drawer { display: grid; grid-template-columns: minmax(0,1fr); gap: var(--s4); align-items: start; }
.with-drawer.open { grid-template-columns: minmax(0,1fr) 360px; }
.drawer { position: sticky; top: 0; background: var(--surface); border-radius: var(--r-panel); padding: var(--s4); display: grid; gap: var(--s3); animation: rise var(--t-fast) var(--ease-out); max-height: calc(100dvh - 120px); overflow-y: auto; }
.drawer-head { display: flex; align-items: flex-start; gap: var(--s2); }
.drawer-head h3 { flex: 1; min-width: 0; font-size: 19px; overflow-wrap: anywhere; }
.drawer .thumb { border-radius: var(--r-ctl); overflow: hidden; background: var(--raised); }
.rowsel { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
.table tr.selected td { background: var(--accent-tint) !important; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--hover); }
.table td.actions { width: 1%; white-space: nowrap; text-align: right; }
.kebab { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--text-muted); cursor: pointer; }
.kebab:hover, .kebab[aria-expanded="true"] { background: var(--control); color: var(--text); }
.kebab .od-icon { --od-icon-size: 18px; }
.bulkbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: 8px 8px 8px var(--s3); border-radius: var(--r-card); background: var(--raised); animation: rise var(--t-fast) var(--ease-out); }
.bulkbar strong { margin-right: auto; }

/* Context menu */
.ctxmenu { position: fixed; z-index: 70; min-width: 264px; max-width: 320px; padding: 6px; border-radius: var(--r-card); background: var(--raised); display: grid; gap: 1px; animation: rise var(--t-fast) var(--ease-out); outline: 1px solid rgba(255,255,255,.06); }
[data-theme="light"] .ctxmenu { outline-color: rgba(0,0,0,.08); }
.ctxmenu .grp { padding: 8px 10px 4px; font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.ctxmenu .grp.ai { color: var(--info); }
.ctxmenu [role="menuitem"] { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; align-items: center; column-gap: 10px; min-height: 40px; padding: 6px 10px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--text); text-align: left; font-size: 14.5px; cursor: pointer; width: 100%; }
.ctxmenu [role="menuitem"]:hover, .ctxmenu [role="menuitem"]:focus-visible { background: var(--control); outline: none; }
.ctxmenu [role="menuitem"] .od-icon { --od-icon-size: 16px; color: var(--text-muted); }
.ctxmenu [role="menuitem"].ai .od-icon { color: var(--info); }
.ctxmenu [role="menuitem"].danger { color: var(--err); }
.ctxmenu [role="menuitem"].danger .od-icon { color: var(--err); }
.ctxmenu .hint { font-size: 12px; color: var(--text-muted); }
.ctxmenu .cmd { grid-column: 2 / 4; font: 400 11.5px/1.4 var(--font-mono); color: var(--text-muted); overflow-wrap: anywhere; }
.ctxmenu .sep { height: 1px; margin: 4px 8px; background: var(--control); }

/* Files grid + upload */
.fgrid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.ftile { position: relative; display: grid; grid-template-rows: auto auto; gap: 8px; padding: 10px; border-radius: var(--r-card); background: var(--surface); cursor: pointer; transition: background var(--t-fast) var(--ease-out); }
.ftile:hover { background: var(--hover); }
.ftile.selected { background: var(--accent-tint); }
.ftile .art { border-radius: var(--r-ctl); background: var(--raised); display: grid; place-items: center; aspect-ratio: 800 / 420; overflow: hidden; color: var(--text-muted); }
.ftile .art .od-icon { --od-icon-size: 36px; }
.ftile .art img { display: block; width: 100%; height: auto; }
.ftile .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ftile .kebab { position: absolute; top: 14px; right: 14px; background: var(--surface); }
.dropzone { display: grid; place-items: center; gap: 6px; padding: var(--s4); border-radius: var(--r-card); background: var(--surface); outline: 2px dashed var(--control); outline-offset: -8px; text-align: center; color: var(--text-muted); font-size: 14px; }
.dropzone.over { background: var(--accent-tint); outline-color: var(--accent); color: var(--text); }
.progress { height: 6px; border-radius: var(--r-pill); background: var(--raised); overflow: hidden; }
.progress i { display: block; height: 100%; width: 100%; background: var(--info); transform-origin: left; transition: transform 200ms linear; }

/* Pins */
.statstrip { display: grid; gap: var(--s3); grid-template-columns: repeat(4, minmax(0,1fr)); }
.statstrip .card { padding: var(--s3) var(--s4); gap: 2px; }
.redund { display: grid; gap: 4px; min-width: 120px; }
.redund .bars { display: flex; gap: 3px; }
.redund .bars i { width: 14px; height: 6px; border-radius: 2px; background: var(--control); }
.redund .bars i.on { background: var(--ok); }
.redund.risk .bars i.on { background: var(--warn); }

/* Explore workspace */
.xws { display: grid; gap: var(--s4); grid-template-columns: 260px minmax(0,1fr) 340px; align-items: start; }
.agentlist { display: grid; gap: 6px; }
.agentcard { display: grid; gap: 4px; padding: 12px 14px; border: 0; border-radius: var(--r-card); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; width: 100%; transition: background var(--t-fast) var(--ease-out); }
.agentcard:hover { background: var(--hover); }
.agentcard[aria-pressed="true"] { background: var(--raised); }
.agentcard[aria-pressed="true"] strong::after { content: " · selected"; font-weight: 500; color: var(--info); }
.agentcard .small { color: var(--text-muted); }
.dag { width: 100%; height: auto; display: block; }
.dag text { font: 500 11px var(--font-mono); fill: var(--text); }
.dag .lbl { fill: var(--text-muted); font-size: 10px; }

/* Peers map */
.peermap { width: 100%; height: auto; display: block; border-radius: var(--r-card); background: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s3); font-size: 13px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Sheet (manage agents) */
.sheet { width: min(760px, 100%); max-height: 86vh; overflow-y: auto; background: var(--surface); border-radius: var(--r-panel); padding: var(--s4); display: grid; gap: var(--s3); animation: rise var(--t-fast) var(--ease-out); align-self: center; }
.checks { display: grid; gap: 4px 16px; grid-template-columns: repeat(3, minmax(0,1fr)); }
.checks label { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14.5px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 56px 16px minmax(0,1fr); gap: 10px; align-items: start; padding: 8px 0; font-size: 14px; }
.timeline .t { font: 400 12px/1.6 var(--font-mono); color: var(--text-muted); }
.timeline .dot2 { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--control); }
.timeline .dot2.warn { background: var(--warn); } .timeline .dot2.ok { background: var(--ok); } .timeline .dot2.info { background: var(--info); } .timeline .dot2.err { background: var(--err); }

@media (max-width: 1280px) { .xws { grid-template-columns: 240px minmax(0,1fr); } .xws > :last-child { grid-column: 1 / -1; } }
